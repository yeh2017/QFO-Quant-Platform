name: 数据同步问题
description: 股票、ETF、可转债、因子或新闻数据无法同步或同步结果异常
title: "[数据同步] "
labels:
  - 数据问题
body:
  - type: markdown
    attributes:
      value: |
        请提供同步对象、时间范围和完整报错。不要提交数据源 Token 或账号。
  - type: input
    id: qfo-version
    attributes:
      label: QFO 版本
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: windows-version
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 在终端运行 `python --version`；稳定版用户可填写“未单独安装”。
      placeholder: Python 3.11.9 / 未单独安装
    validations:
      required: true
  - type: dropdown
    id: data-module
    attributes:
      label: 出现问题的数据模块
      multiple: true
      options:
        - A 股行情与因子
        - ETF
        - 可转债
        - 资金流向
        - 融资融券
        - 财务数据
        - 行业指数
        - 新闻与大模型
        - 其他
    validations:
      required: true
  - type: input
    id: date-range
    attributes:
      label: 同步时间范围
      placeholder: 2024-01-01 至 2025-12-31
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: 说明选择了哪些数据、点击了哪个按钮，以及问题出现的时间点。
      placeholder: |
        1. 打开数据中台……
        2. 选择……
        3. 点击同步后……
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 错误截图
      description: 可直接拖入图片；上传前请遮挡 Token、账号和本地隐私信息。
      placeholder: 请拖入完整错误截图；没有截图请说明原因。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: 请粘贴完整日志，尤其是最早出现的错误，并删除敏感信息。
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我没有提交数据源 Token、账号或其他敏感信息。
          required: true
